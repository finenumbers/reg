# Build and push Reg images to GHCR (linux/amd64 only).
#
# Tags:
#   ghcr.io/finenumbers/reg:<version>           — app (Dockerfile target: runner)
#   ghcr.io/finenumbers/reg:latest
#   ghcr.io/finenumbers/reg:<version>-migrator  — prisma migrate (target: migrator)
#   ghcr.io/finenumbers/reg:latest-migrator
#
# Triggered by annotated tags v* (e.g. v1.0.0 → version 1.0.0).

name: GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image version without v prefix (e.g. 1.0.0). Leave empty to use latest only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: finenumbers/reg

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "app_tags<<EOF"
            if [[ -n "$VERSION" ]]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            fi
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "EOF"
            echo "migrate_tags<<EOF"
            if [[ -n "$VERSION" ]]; then
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-migrator"
            fi
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-migrator"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push app (runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.migrate_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
